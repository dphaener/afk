<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{template "title" .View}} - afk</title>
<link rel="stylesheet" href="{{asset "afk.css"}}">
<link rel="stylesheet" href="{{asset "page.css"}}">
{{if not .Chrome.Bare}}<script src="{{asset "live.js"}}" defer></script>
<script src="{{asset "confirm.js"}}" defer></script>
<script src="{{asset "submit.js"}}" defer></script>
{{end}}</head>
<body class="afk">
<div class="shell">
{{with .Chrome}}{{if not .Bare}}
<header class="app-bar{{if not .Overview}} app-bar--back{{end}}">
{{if .Overview}}
  <span class="app-bar__title wordmark">afk</span>
{{else}}
  <a class="icon-btn" href="{{.Back}}" aria-label="{{.BackLabel}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 18l-6-6 6-6"/></svg></a>
  <span class="app-bar__title">{{.Title}}</span>
{{end}}
  <span class="live" data-live-status hidden>Live</span>
</header>
<header class="topnav">
  <a class="wordmark topnav__brand" href="/">afk</a>
  <nav class="topnav__links" aria-label="Main">
    <a class="topnav__link" href="/"{{if eq .Nav "projects"}} aria-current="{{.Current}}"{{end}}>Projects <span class="count count--quiet">{{.Projects}}</span></a>
    <a class="topnav__link" href="/usage"{{if eq .Nav "usage"}} aria-current="{{.Current}}"{{end}}>Usage</a>
  </nav>
  <span class="live topnav__live" data-live-mirror hidden>Live</span>
</header>
{{end}}{{end}}
<main class="page{{if .Chrome.Bare}} page--alone{{end}}">
{{template "content" .View}}
{{block "foot" .Chrome}}{{end}}
</main>
{{with .Chrome.Toast}}<div class="toast-region"><div class="toast" role="status" data-toast>{{.}}</div></div>
{{end}}
</div>
</body>
</html>
