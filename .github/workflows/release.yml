name: Release

# Releases on a merge to main that changes the binary (the decide job reads the
# bump from the commit messages), and on a v* tag pushed by hand. A manual run
# is a dry run unless told otherwise, and even then publishing needs a tag ref.
# Never runs for a pull request: a release is only ever cut from main or a tag.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and keep the files as artifacts, publish nothing'
        type: boolean
        default: true
      version:
        description: 'Version to stamp (no leading v). Empty uses 0.0.0-dev.<commit>'
        type: string
        required: false

# Pushes to main release one after another. queue: max keeps every pending
# push; GitHub's default single queue cancels a waiting run when a newer one
# arrives, which would drop that push's bump. cancel-in-progress would kill a
# release half-way through publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

# Read-only by default; only the release job may write.
permissions:
  contents: read

jobs:
  # The one place the version is worked out. Its own checkout, with full
  # history and tags for nextversion, is never shared with build.
  decide:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    # Fail early and plainly: a real release needs a tag, and a branch run with
    # dry_run off would otherwise build everything and then skip publishing.
    - name: Refuse a real release without a tag
      if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false && github.ref_type != 'tag'
      run: |
        echo "A release needs a v* tag. Run this on a tag, or leave dry_run on." >&2
        exit 1

    # Values from the event go through env, never into the script text.
    - name: Work out the version
      id: decide
      env:
        BEFORE: ${{ github.event.before }}
        DRY_RUN: ${{ inputs.dry_run }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [ "$GITHUB_REF_TYPE" = "tag" ]; then
          # The tag check keeps a stray tag like "vnext" from becoming a version.
          if ! [[ $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not v<major>.<minor>.<patch>." >&2
            exit 1
          fi
          version=${GITHUB_REF_NAME#v}
          tag=$GITHUB_REF_NAME
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$DRY_RUN" = "false" ]; then
            publish=true
            echo "Publishing $tag." >> "$GITHUB_STEP_SUMMARY"
          else
            publish=false
            echo "Dry run: this run would publish $tag." >> "$GITHUB_STEP_SUMMARY"
          fi
        elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
          # A failure here fails the job: an error must never read as a version.
          answer=$(scripts/release-decide.sh "$BEFORE" "$GITHUB_SHA")
          if [ "$answer" = "skip" ]; then
            version=skip
            tag=
            publish=false
            echo "No release: nothing in the binary changed, or this commit already carries a v* tag." >> "$GITHUB_STEP_SUMMARY"
          else
            version=$answer
            tag="v$answer"
            publish=true
            echo "Publishing $tag on $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          fi
        else
          # A hand-started run on a branch: measure from the last release this
          # commit contains, the same idea of "last release" nextversion uses.
          base_tag=$(git tag --merged HEAD --list 'v*' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)
          if [ -n "$base_tag" ]; then
            base=$(git rev-list -n1 "$base_tag")
          else
            base=0000000000000000000000000000000000000000
          fi
          answer=$(scripts/release-decide.sh "$base" "$GITHUB_SHA")
          if [ "$answer" = "skip" ]; then
            echo "This run would publish nothing (skip)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "This run would publish $answer." >> "$GITHUB_STEP_SUMMARY"
          fi
          # A dry run stays a dry run: the build is stamped as before.
          if [ -n "$INPUT_VERSION" ]; then
            version=$INPUT_VERSION
          else
            version="0.0.0-dev.${GITHUB_SHA:0:12}"
          fi
          tag=
          publish=false
        fi
        {
          echo "version=$version"
          echo "publish=$publish"
          echo "tag=$tag"
        } >> "$GITHUB_OUTPUT"

  build:
    needs: decide
    # A push to main that changes nothing in the binary stops here; macos-check
    # and release are skipped with it.
    if: needs.decide.outputs.version != 'skip'
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'

    - name: Run checks
      run: make check

    - name: Build the archives
      env:
        VERSION: ${{ needs.decide.outputs.version }}
      run: scripts/release.sh "$VERSION" dist

    - name: Check the checksums
      working-directory: dist
      run: sha256sum -c checksums.txt

    - name: Run the linux/amd64 binary
      env:
        VERSION: ${{ needs.decide.outputs.version }}
      run: |
        mkdir -p /tmp/afk-x
        tar -xzf "dist/afk_${VERSION}_linux_amd64.tar.gz" -C /tmp/afk-x
        /tmp/afk-x/afk version

    - uses: actions/upload-artifact@v7
      with:
        name: release-files
        path: |
          dist/*.tar.gz
          dist/checksums.txt
        if-no-files-found: error

  # Answers whether a downloaded darwin/arm64 binary runs without codesign.
  macos-check:
    needs: build
    runs-on: macos-latest
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: release-files
        path: dist

    - name: Run the darwin/arm64 binary
      run: |
        mkdir x
        tar -xzf dist/afk_*_darwin_arm64.tar.gz -C x
        cd x
        if ./afk version; then
          echo "The downloaded darwin/arm64 binary runs without codesign." >> "$GITHUB_STEP_SUMMARY"
        elif codesign --force --sign - ./afk && ./afk version; then
          echo "The darwin/arm64 binary needs codesign --force --sign - before it runs." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "The darwin/arm64 binary does not run, even after codesign." >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

  release:
    needs: [ decide, build, macos-check ]
    # decide says publish only for a pushed tag, a hand run on a tag with
    # dry_run off, or a push to main that changed the binary.
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: release-files
        path: dist

    # On a main push the tag does not exist yet, so --target makes it on this
    # commit. A tag made with this run's token starts no new run, which is why
    # this run builds and publishes the release itself.
    - name: Create the release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ needs.decide.outputs.tag }}
      run: |
        if [ "$GITHUB_REF_TYPE" = "tag" ]; then
          gh release create "$TAG" dist/*.tar.gz dist/checksums.txt \
            --title "afk $TAG" --generate-notes --verify-tag
        else
          gh release create "$TAG" dist/*.tar.gz dist/checksums.txt \
            --title "afk $TAG" --generate-notes --target "$GITHUB_SHA"
        fi
