name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    # Named explicitly so CI matches the VM; `ubuntu-latest` is still 24.04.
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    # The repo has no .ruby-version, so the version is pinned here. The plan
    # parser (plugins/afk/scripts/plan_to_args.rb) is stdlib only.
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'

    # `make check` is the single entry point: gofmt, vet, Go tests, the plugin
    # node and ruby suites, the prompt size check and the hook shell tests. It
    # needs bash and jq, which the runner image provides, plus the Ruby above.
    - name: Run checks
      run: make check
